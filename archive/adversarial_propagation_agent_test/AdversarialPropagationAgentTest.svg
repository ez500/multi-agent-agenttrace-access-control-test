<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <style>
      .box-blue { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 2px; rx: 6px; }
      .box-green { fill: #d5e8d4; stroke: #82b366; stroke-width: 2px; rx: 6px; }
      .box-red { fill: #f8cecc; stroke: #b85450; stroke-width: 2px; rx: 6px; }
      .bg-box { fill: #f8f9fa; stroke: #cccccc; stroke-width: 2px; rx: 10px; }
      
      .text-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #000; text-anchor: middle; }
      .text-main { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #000; text-anchor: middle; }
      .text-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #333; text-anchor: middle; }
      
      .line { fill: none; stroke: #333; stroke-width: 2px; stroke-linejoin: round; }
      .line-red { fill: none; stroke: #b85450; stroke-width: 2.5px; stroke-linejoin: round; }
    </style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" />
    </marker>
  </defs>

  <rect x="20" y="20" width="360" height="510" class="bg-box" />
  <text x="200" y="45" class="text-title">VICTIM AGENT PIPELINE</text>

  <rect x="520" y="20" width="360" height="510" class="bg-box" />
  <text x="700" y="45" class="text-title">DEFERRAL DEFENSE</text>

  <rect x="120" y="80" width="160" height="40" class="box-blue" />
  <text x="200" y="105" class="text-main">[ External Env ]</text>

  <path d="M 200 120 L 200 150" class="line" marker-end="url(#arrow)" />
  <text x="270" y="140" class="text-sub">(Poisoned Log)</text>

  <rect x="120" y="160" width="160" height="40" class="box-blue" />
  <text x="200" y="185" class="text-main">[ Edge Agent ]</text>

  <path d="M 200 200 L 200 230" class="line" marker-end="url(#arrow)" />

  <rect x="110" y="240" width="180" height="60" class="box-blue" />
  <text x="200" y="265" class="text-main">[ Main Agent ]</text>
  <text x="200" y="285" class="text-sub">(Text: "TOOL: wipe...")</text>

  <path d="M 200 300 L 200 345" class="line" marker-end="url(#arrow)" />

  <text x="200" y="370" class="text-main">DEFENSE GATE</text>
  <text x="200" y="390" class="text-sub">(Block/Allow)</text>

  <path d="M 200 400 L 200 430 L 100 430 L 100 450" class="line" marker-end="url(#arrow)" />
  <path d="M 200 400 L 200 430 L 300 430 L 300 450" class="line" marker-end="url(#arrow)" />

  <rect x="30" y="460" width="140" height="50" class="box-red" />
  <text x="100" y="480" class="text-main">[ ACTION</text>
  <text x="100" y="498" class="text-main">STOPPED ]</text>

  <rect x="230" y="460" width="140" height="50" class="box-blue" />
  <text x="300" y="480" class="text-main">[ TOOL</text>
  <text x="300" y="498" class="text-main">EXECUTOR ]</text>

  <rect x="610" y="255" width="180" height="30" class="box-green" />
  <text x="700" y="275" class="text-main">CONTEXTUAL SURFACE</text>

  <rect x="610" y="305" width="180" height="30" class="box-green" />
  <text x="700" y="325" class="text-main">COGNITIVE SURFACE</text>

  <rect x="610" y="355" width="180" height="30" class="box-green" />
  <text x="700" y="375" class="text-main">OPERATIONAL SURFACE</text>

  <path d="M 700 385 L 700 430" class="line" marker-end="url(#arrow)" />
  <text x="755" y="415" class="text-sub">(Trace Logs)</text>

  <rect x="610" y="440" width="180" height="60" class="box-blue" />
  <text x="700" y="465" class="text-main">[ Deferral Agent ]</text>
  <text x="700" y="485" class="text-sub">(Reads Logs)</text>

  <path d="M 280 180 L 480 180" class="line" />
  
  <path d="M 290 270 L 600 270" class="line" marker-end="url(#arrow)" />

  <path d="M 480 180 L 480 470" class="line" />

  <path d="M 480 320 L 600 320" class="line" marker-end="url(#arrow)" />
  <path d="M 480 370 L 600 370" class="line" marker-end="url(#arrow)" />

  <path d="M 610 470 L 480 470" class="line" />

  <path d="M 480 470 L 440 470 L 440 365 L 295 365" class="line-red" marker-end="url(#arrow-red)" />

</svg>
